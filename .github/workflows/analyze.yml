name: ERA analyze

# 分析：entries.analyze 外部入口 → 合并 content/data.json；无 key 时 status=failed/reason=no_api_key/executed=false，
# 脚本 exit 0 但 gate 判失败，本轮不 commit、不触发 deploy。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: era-research
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze (config entry, budget from config)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/ci/analyze.mjs --report reports/analyze.json

      - name: Validate whole content dir (repo CLI, read only)
        if: always()
        continue-on-error: true
        run: node scripts/ci/entry-run.mjs --name validate --report reports/validate-content.json

      - name: Score recompute check (read only, never --write)
        if: always()
        continue-on-error: true
        run: node scripts/ci/entry-run.mjs --name scoreCheck --report reports/score-check.json


      - name: Gate statuses
        if: always()
        run: node scripts/ci/gate.mjs --require analyze,entry-validate,entry-scoreCheck --report reports/gate.json

      - name: Fact check (counter evidence trail)
        if: always()
        run: node scripts/ci/factcheck.mjs --report reports/factcheck.json

      - name: Configure git
        run: |
          git config user.name "era-bot"
          git config user.email "era-bot@users.noreply.github.com"

      - name: Commit (idempotent, whitelist)
        run: node scripts/ci/commit.mjs --push --report reports/commit.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analyze-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn
